<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Registration</title>
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>

<body class="min-h-screen flex items-center justify-center bg-gradient-to-br from-cyan-500 to-emerald-400 px-4">

  <div class="w-full max-w-md sm:max-w-lg">

    <h1 class="text-3xl sm:text-4xl font-bold text-center text-[#fff6d7] mb-6">
      Registration Page
    </h1>

    <form class="flex flex-col gap-3 bg-[#212121]/95 backdrop-blur-md text-white rounded-2xl px-6 py-8 shadow-2xl">

      <label for="email">E-mail</label>
      <input type="email" id="email" required
        class="h-11 rounded-xl px-4 text-black focus:outline-none focus:ring-2 focus:ring-cyan-400 bg-white">

      <label for="phone">Phone</label>
      <input type="number" id="phone" required
        class="h-11 rounded-xl px-4 text-black focus:outline-none focus:ring-2 focus:ring-cyan-400 bg-white">

      <label for="password">Password</label>
      <div class="flex items-center border rounded-xl px-3 bg-white">
        <input class="flex-1 h-11 text-black focus:outline-none" type="password" id="password" required>
        <button class="eye text-xl" type="button">🫣</button>
      </div>

      <label for="password2">Confirm Password</label>
      <div class="flex items-center border rounded-xl px-3 bg-white">
        <input class="flex-1 h-11 text-black focus:outline-none" type="password" id="password2" required>
        <button class="eye2 text-xl" type="button">🫣</button>
      </div>

      <!-- Captcha -->
      <p class="cap bg-white text-black rounded-xl py-2 text-center font-mono tracking-widest text-lg"></p>

      <input class="cpt h-11 rounded-xl px-4 text-black focus:outline-none focus:ring-2 focus:ring-cyan-400 bg-white"
        type="text" placeholder="Enter captcha">

      <button class="button bg-[#15d2c7] mt-2 py-3 rounded-2xl text-black font-semibold disabled:opacity-50 disabled:cursor-not-allowed transition"
        disabled>
        Submit
      </button>

    </form>

  </div>

</body>

<script>
  let pass=''
  let pass2=''
  let user_cpt=''

  document.querySelector('.cpt').addEventListener('change',(e)=>{
    user_cpt=e.target.value
    if(pass==pass2 && captcha==user_cpt){
      document.querySelector('.button').disabled=false
    }
    if(captcha!=user_cpt){
      alert('mismatch captcha')
    }
  })

  let captcha=Math.random().toString(36).substring(2,10)
  document.querySelector('.cap').innerText=captcha

  document.querySelector('#password').addEventListener('change',(e)=>{
    pass=e.target.value
  })

  document.querySelector('#password2').addEventListener('change',(a)=>{
    pass2 = a.target.value
    if(pass2!=pass){
      alert('mismatch password')
    }
  })

  document.querySelector('.eye').addEventListener('click',()=>{
    document.querySelector('#password').type="text"
  })

  document.querySelector('.eye2').addEventListener('click',()=>{
    document.querySelector('#password2').type="text"
  })
</script>

</html>
