<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>To-Do List</title>
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <style>
  @import "tailwindcss";

  :root {
    --bg: #79848f;
    --card: #d47a7a;
    --primary: #f9c697;
    --primary-hover: #2563eb;
    --text-main: #87857f;
    --text-muted: #d5e2f4;
    --border: #ffffff;
    --item-bg: #e0ffa2;
  }
</style>
</head>

<body class="min-h-screen flex items-center justify-center bg-[var(--bg)]">
  <div class="w-full max-w-md p-8 rounded-xl shadow-lg bg-[var(--card)] flex flex-col gap-6">

    <h1 class="text-4xl font-bold text-center text-[var(--primary)]">
      To Do List
    </h1>

    <div class="flex gap-2">
      <input
        type="text"
        placeholder="Add a new task..."
        class="flex-1 px-4 py-2 rounded-lg border border-[var(--border)]
               focus:outline-none focus:ring-2 focus:ring-[var(--primary)]"
      />
      <button
        class="px-4 py-2 rounded-lg text-white
               bg-[var(--primary)]
               hover:bg-[var(--primary-hover)]
               active:scale-95 transition"
      >
        Add
      </button>
    </div>

    <ul class="list flex flex-col gap-3"></ul>

  </div>
</body>

<script>
  const input = document.querySelector('input')
  const list = document.querySelector('.list')
  const button = document.querySelector('button')

  let todos = JSON.parse(localStorage.getItem('local')) || []

  function saveTodos() {
    localStorage.setItem('local', JSON.stringify(todos))
  }

  function display() {
  list.innerHTML = ''
  todos.forEach((todo, index) => {
    const li = document.createElement('li')
    li.className =
      'flex items-center justify-between px-4 py-2 rounded-lg shadow-sm ' +
      'bg-[var(--item-bg)] border border-[var(--border)]'

    li.innerHTML = `
      <span class="text-[var(--text-main)]">${todo}</span>
      <div class="flex gap-2 text-lg">
        <button onclick="edit(${index})" class="hover:scale-110 transition">🖊️</button>
        <button onclick="del(${index})" class="hover:scale-110 transition">🗑️</button>
      </div>
    `
    list.append(li)
  })
}


  button.addEventListener('click', () => {
    if (input.value.trim() === '') return
    todos.push(input.value)
    saveTodos()
    display()
    input.value = ''
  })

  display()

  function del(index) {
    todos.splice(index, 1)
    saveTodos()
    display()
  }

  function edit(index) {
    input.value = todos[index]
    todos.splice(index, 1)
    saveTodos()
    display()
  }
</script>
</html>
